<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: file:; style-src 'self' 'unsafe-inline'">
<title>Shotdrawer</title>
<link rel="stylesheet" href="look.css">
</head>
<body>
<div class="pic"><img id="pic" alt=""></div>
<div class="cap"><span class="n" id="name"></span><span class="m" id="meta"></span></div>
<div class="hint" id="hint" hidden><kbd>↑</kbd> <kbd>↓</kbd> to look at the next one, <kbd>Space</kbd> or <kbd>Esc</kbd> to close</div>
<script src="look.js"></script>
</body>
</html>
