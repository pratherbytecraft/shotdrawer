<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'">
<title>Shotdrawer</title>
<link rel="stylesheet" href="panel.css">
</head>
<body>
<div class="panel" id="panel">
  <div class="head">
    <svg class="badge" viewBox="0 0 120 120"><defs><linearGradient id="br" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#9fa8ff"/><stop offset=".55" stop-color="#5865F2"/><stop offset="1" stop-color="#4c46d6"/></linearGradient><linearGradient id="bs" x1="0" y1="42" x2="0" y2="78" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#a8e6ff"/><stop offset="1" stop-color="#2f8cf0"/></linearGradient></defs><circle cx="60" cy="60" r="54" fill="#0b0e1a" stroke="url(#br)" stroke-width="5"/><rect x="36" y="42" width="48" height="36" rx="3" fill="url(#bs)"/><circle cx="70.6" cy="53.5" r="4.7" fill="#fff" fill-opacity=".9"/><path d="M36 78 L52.3 60 L62.9 70.1 L69.6 64.3 L84 78 Z" fill="#0b0e1a" fill-opacity=".55"/><path d="M26 44V30h14M80 30h14v14M94 76v14H80M40 90H26V76" fill="none" stroke="#f5f7ff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span class="t">Screenshots</span>
    <span class="count" id="count" hidden></span>
  </div>
  <div class="empty" id="empty">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M1.8 5V2.5a.7.7 0 0 1 .7-.7H5M11 1.8h2.5a.7.7 0 0 1 .7.7V5M14.2 11v2.5a.7.7 0 0 1-.7.7H11M5 14.2H2.5a.7.7 0 0 1-.7-.7V11"/><path d="M4.5 11l2.5-3 1.8 2 1.2-1.2 1.5 2.2"/></svg>
    <div class="big">No screenshots yet</div>
    <div class="small">Press <kbd>⇧⌘3</kbd> for the whole screen or <kbd>⇧⌘4</kbd> for part of it. New ones show up here right away.</div>
  </div>
  <div class="foot">
    <span class="sp"></span>
    <button class="fb" id="quit">Quit</button>
  </div>
</div>
<script src="panel.js"></script>
</body>
</html>
